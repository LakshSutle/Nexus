steps:
  # 1. Build the backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-backend:$COMMIT_SHA'
      - './backend'
    id: 'build-backend'

  # 2. Push the backend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-backend:$COMMIT_SHA'
    id: 'push-backend'
    waitFor: ['build-backend']

  # 3. Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nexus-backend'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-backend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=SUPABASE_URL=$_SUPABASE_URL,SUPABASE_SERVICE_KEY=$_SUPABASE_SERVICE_KEY,GEMINI_API_KEY=$_GEMINI_API_KEY,ENVIRONMENT=production,FRONTEND_URL=$_FRONTEND_URL'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # 4. Build the frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-frontend:$COMMIT_SHA'
      - '.'
    id: 'build-frontend'
    waitFor: ['deploy-backend']

  # 5. Push the frontend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-frontend:$COMMIT_SHA'
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # 6. Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nexus-frontend'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-frontend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

images:
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-backend:$COMMIT_SHA'
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/nexus-frontend:$COMMIT_SHA'

substitutions:
  _AR_REGION: 'us-central1'
  _DEPLOY_REGION: 'us-central1'
  _AR_REPO: 'nexus-repo'
  _SUPABASE_URL: ''
  _SUPABASE_SERVICE_KEY: ''
  _GEMINI_API_KEY: ''
  _FRONTEND_URL: ''
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  _NEXT_PUBLIC_API_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
